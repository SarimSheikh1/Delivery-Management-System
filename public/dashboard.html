<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · DeliveryPro</title><link rel="stylesheet" href="/css/style.css"></head><body><header><a class="brand" href="/">🚚 DeliveryPro</a><nav><a href="/tracking.html">Tracking</a><button id="logout">Logout</button></nav></header><main class="dashboard"><div class="dashhead"><div><p class="eyebrow" id="role"></p><h1 id="welcome">Dashboard</h1></div><a class="btn" id="newOrder" href="#">New order</a></div><div class="stats" id="stats"></div><section class="panel"><h2>Recent deliveries</h2><div class="orders" id="orders"></div></section><section class="panel" id="orderForm" hidden><h2>Create delivery order</h2><form id="create"><div class="formgrid"><input name="pickup_address" placeholder="Pickup address" required><input name="delivery_address" placeholder="Delivery address" required><input name="package_description" placeholder="Package description"><input name="package_weight" type="number" value="1" placeholder="Weight KG"><select name="delivery_type"><option>Standard</option><option>Express</option><option>Same Day</option><option>Scheduled</option></select><select name="payment_method"><option>Cash on Delivery</option><option>Online Payment</option><option>Bank Transfer</option><option>Wallet</option></select><button class="btn">Create order</button></div></form><div class="error"></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/js/dashboard.js"></script></body></html>
